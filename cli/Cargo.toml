[package]
name = "bitmapflow-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for generating animation inbetween frames using optical flow"

[[bin]]
name = "bitmapflow-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
image = "0.25"
opencv = { version = "0.93", features = ["clang-runtime"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
