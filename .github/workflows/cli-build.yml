name: Build CLI

on:
  push:
    branches: [main, claude/**]
    paths:
      - "cli/**"
      - ".github/workflows/cli-build.yml"
    tags:
      - "cli-v*"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-build.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: cli

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bitmapflow-cli
            archive: bitmapflow-cli-linux-x86_64.tar.gz

          - os: windows-latest
            artifact: bitmapflow-cli.exe
            archive: bitmapflow-cli-windows-x86_64.zip

          - os: macos-latest
            artifact: bitmapflow-cli
            archive: bitmapflow-cli-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCV (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev libopencv-contrib-dev libclang-dev

      - name: Install OpenCV (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv llvm

      - name: Set LLVM path (macOS)
        if: runner.os == 'macOS'
        run: echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> $GITHUB_ENV

      - name: Install OpenCV and LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install opencv llvm -y
        shell: pwsh

      - name: Set OpenCV env (Windows)
        if: runner.os == 'Windows'
        run: |
          $buildDir = "C:\tools\opencv\build"

          # Find the world lib dynamically (skip debug libs ending in 'd.lib')
          $worldLib = Get-ChildItem $buildDir -Recurse -Filter "opencv_world*.lib" | Where-Object { $_.Name -notmatch 'd\.lib$' } | Select-Object -First 1
          if (-not $worldLib) {
            Write-Error "Could not find opencv_world*.lib"
            exit 1
          }
          $libDir = $worldLib.DirectoryName
          $libName = $worldLib.BaseName
          Write-Host "OpenCV lib: $($worldLib.FullName)"

          echo "OPENCV_LINK_PATHS=$libDir" >> $env:GITHUB_ENV
          echo "OPENCV_INCLUDE_PATHS=$buildDir\include" >> $env:GITHUB_ENV
          echo "OPENCV_LINK_LIBS=$libName" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

          # Add DLLs to PATH
          $dllDir = $libDir -replace '\\lib$', '\bin'
          echo "$dllDir" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

          # Tell clang where MSVC and Windows SDK headers are so the binding generator works
          $msvcBase = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          $msvcInclude = (Get-ChildItem $msvcBase -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\include"

          $sdkBase = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdkVer = (Get-ChildItem $sdkBase -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $ucrt = "$sdkBase\$sdkVer\ucrt"
          $shared = "$sdkBase\$sdkVer\shared"
          $um = "$sdkBase\$sdkVer\um"

          Write-Host "MSVC include: $msvcInclude"
          Write-Host "UCRT: $ucrt"

          $clangArgs = "-isystem$msvcInclude -isystem$ucrt -isystem$shared -isystem$um"
          echo "OPENCV_CLANG_ARGS=$clangArgs" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Cargo build
        run: cargo build --release

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar czf ${{ matrix.archive }} -C target/release ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target\release\${{ matrix.artifact }} -DestinationPath ${{ matrix.archive }}
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          if-no-files-found: error
          path: cli/${{ matrix.archive }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version' cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        working-directory: .

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: bitmapflow-cli v${{ steps.version.outputs.version }}
          body: |
            ## bitmapflow-cli v${{ steps.version.outputs.version }}

            CLI tool for generating animation inbetween frames using optical flow.

            ### Platforms
            - **Linux x86_64**
            - **macOS ARM64 (Apple Silicon)**
            - **Windows x86_64**

            ### Requirements
            - **Linux**: `sudo apt install libopencv-dev libopencv-contrib-dev`
            - **macOS**: `brew install opencv`
            - **Windows**: OpenCV 4.x DLLs must be on PATH

            ### Usage
            ```
            bitmapflow-cli \
              --input sprite.png \
              --output interpolated.png \
              --frame-width 100 --frame-height 100 --frame-count 5 \
              --inbetweens 1 --loop --columns 5 --json
            ```
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
