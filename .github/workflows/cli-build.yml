name: Build CLI

on:
  push:
    branches: [main, claude/**]
    paths:
      - "cli/**"
      - ".github/workflows/cli-build.yml"
    tags:
      - "cli-v*"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-build.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: cli

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bitmapflow-cli
            archive: bitmapflow-cli-linux-x86_64.tar.gz

          - os: macos-latest
            artifact: bitmapflow-cli
            archive: bitmapflow-cli-macos-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCV (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev libopencv-contrib-dev libclang-dev

      - name: Install OpenCV (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv llvm

      - name: Set LLVM path (macOS)
        if: runner.os == 'macOS'
        run: echo "LLVM_CONFIG_PATH=$(brew --prefix llvm)/bin/llvm-config" >> $GITHUB_ENV

      - name: Cargo build
        run: cargo build --release

      - name: Package
        run: tar czf ${{ matrix.archive }} -C target/release ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          if-no-files-found: error
          path: cli/${{ matrix.archive }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version' cli/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        working-directory: .

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: bitmapflow-cli v${{ steps.version.outputs.version }}
          body: |
            ## bitmapflow-cli v${{ steps.version.outputs.version }}

            CLI tool for generating animation inbetween frames using optical flow.

            ### Platforms
            - **Linux x86_64** — ready to use
            - **macOS ARM64 (Apple Silicon)** — ready to use
            - **Windows** — build from source (see below)

            ### Requirements
            - **Linux**: `sudo apt install libopencv-dev libopencv-contrib-dev`
            - **macOS**: `brew install opencv`
            - **Windows**: Install OpenCV 4.x and LLVM, then `cargo build --release` in the `cli/` directory

            ### Usage
            ```
            bitmapflow-cli \
              --input sprite.png \
              --output interpolated.png \
              --frame-width 100 --frame-height 100 --frame-count 5 \
              --inbetweens 1 --loop --columns 5 --json
            ```
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
